<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Vozi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --card: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #14161a);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --accent: #0fa968;
    --accent-2: #0b8a55;
    --soft: rgba(15, 169, 104, .12);
    --warn: #c98200;
    --warn-soft: rgba(217, 139, 0, .14);
    --bad: #e0453a;
    --bad-soft: rgba(224, 69, 58, .12);
    --line: rgba(127, 127, 127, .18);
    --r: 18px;
    --nav-h: 64px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  .app { max-width: 520px; margin: 0 auto; padding: 14px 14px calc(var(--nav-h) + var(--safe-b) + 20px); }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), #34d399); color: #fff; font-weight: 800; font-size: 19px; }
  .brand b { display: block; font-size: 19px; letter-spacing: -.02em; }
  .brand small { color: var(--hint); font-size: 12px; }
  .pill { padding: 8px 14px; border-radius: 999px; background: var(--soft); color: var(--accent-2);
    font-weight: 700; white-space: nowrap; font-size: 14px; }

  .card { background: var(--card); border-radius: var(--r); padding: 16px; margin-bottom: 12px;
    border: 1px solid var(--line); }
  h2 { margin: 6px 2px 12px; font-size: 20px; letter-spacing: -.02em; }
  .muted { color: var(--hint); font-size: 13px; }

  .task { width: 100%; text-align: left; display: block; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r); padding: 14px; margin-bottom: 10px; transition: transform .12s; }
  .task:active { transform: scale(.985); }
  .task-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .task-title { font-weight: 700; }
  .reward { color: var(--accent-2); font-weight: 800; white-space: nowrap; }
  .meta { color: var(--hint); font-size: 12.5px; margin-top: 6px; }
  .badge { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .badge.ok { background: var(--soft); color: var(--accent-2); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }

  .empty { text-align: center; color: var(--hint); padding: 36px 16px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 4px; }
  .stat { background: var(--bg); border-radius: 14px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 15px; }
  .stat span { color: var(--hint); font-size: 11.5px; }

  .btn { width: 100%; padding: 14px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 700; }
  .btn:active { background: var(--accent-2); }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: var(--bg); color: var(--text); }
  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: 14px; }
  input[type=text], input[type=tel], input[type=number], textarea {
    width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--bg); outline: none; }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 140px; resize: vertical; }
  .counter { font-size: 12px; color: var(--hint); margin-top: 4px; }
  .counter.good { color: var(--accent-2); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 9px 14px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-size: 14px; }
  .chip.on { background: var(--soft); border-color: var(--accent); color: var(--accent-2); font-weight: 700; }
  .photo-box { display: block; border: 2px dashed var(--line); border-radius: 14px; padding: 18px; text-align: center;
    color: var(--hint); }
  .photo-box img { max-width: 100%; max-height: 220px; border-radius: 10px; display: block; margin: 0 auto; }
  .note { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-top: 10px; }
  .note.bad { background: var(--bad-soft); color: var(--bad); }
  .note.ok { background: var(--soft); color: var(--accent-2); }

  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .t { font-weight: 600; font-size: 14px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    display: flex; justify-content: space-around; padding: 6px 8px calc(6px + var(--safe-b)); z-index: 10; }
  nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0;
    color: var(--hint); font-size: 11.5px; font-weight: 600; }
  nav button .i { font-size: 21px; line-height: 1; }
  nav button.on { color: var(--accent-2); }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); display: none; z-index: 20; }
  .sheet-bg.on { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; background: var(--card);
    border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + var(--safe-b)); transform: translateY(100%);
    transition: transform .22s ease; z-index: 21; max-width: 520px; margin: 0 auto; }
  .sheet.on { transform: translateY(0); }
  .sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
  .desc { white-space: pre-wrap; margin: 10px 0 4px; }

  .toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -150%); background: #1f2329; color: #fff;
    padding: 11px 16px; border-radius: 14px; font-size: 14px; z-index: 40; max-width: 92vw; transition: transform .25s; }
  .toast.show { transform: translate(-50%, 0); }
  .toast.bad { background: var(--bad); }
  .toast.ok { background: var(--accent-2); }

  .fatal { text-align: center; padding: 60px 20px; }
  .fatal .logo { margin: 0 auto 16px; width: 56px; height: 56px; font-size: 26px; }
  .spin { width: 28px; height: 28px; border: 3px solid var(--soft); border-top-color: var(--accent);
    border-radius: 50%; animation: s .8s linear infinite; margin: 40px auto; }
  @keyframes s { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">V</div>
      <div><b>Vozi</b><small>vazifalar platformasi</small></div>
    </div>
    <div class="pill" id="top-balance">0 so'm</div>
  </header>

  <div id="loading"><div class="spin"></div></div>
  <div id="fatal" class="fatal hidden"></div>

  <section id="view-tasks" class="hidden">
    <h2>Vazifalar</h2>
    <div id="task-list"></div>
  </section>

  <section id="view-history" class="hidden">
    <h2>Tarix</h2>
    <div class="card"><div class="t" style="font-weight:700;margin-bottom:4px">Ishlarim</div><div id="sub-list"></div></div>
    <div class="card"><div class="t" style="font-weight:700;margin-bottom:4px">Pul yechish</div><div id="wd-list"></div></div>
  </section>

  <section id="view-profile" class="hidden">
    <h2>Profil</h2>
    <div class="card">
      <div style="font-weight:700;font-size:17px" id="p-name"></div>
      <div class="stats">
        <div class="stat"><b id="p-balance">0</b><span>Balans</span></div>
        <div class="stat"><b id="p-earned">0</b><span>Jami ishlangan</span></div>
        <div class="stat"><b id="p-approved">0</b><span>Qabul qilingan</span></div>
      </div>
    </div>
    <div class="card">
      <div style="font-weight:700;font-size:16px">💳 Pul yechish</div>
      <div class="muted" id="wd-min"></div>
      <div id="wd-pending" class="note hidden">Sizda ko'rib chiqilayotgan so'rov bor. To'lov amalga oshgach, yangisini yuborishingiz mumkin.</div>
      <div id="wd-form">
        <label>To'lov usuli</label>
        <div class="chips" id="wd-methods"></div>
        <label id="wd-details-label">Karta raqami</label>
        <input type="tel" id="wd-details" inputmode="numeric" autocomplete="off">
        <label>Summa (so'm)</label>
        <input type="number" id="wd-amount" inputmode="numeric" min="0">
        <div style="height:14px"></div>
        <button class="btn" id="wd-btn">Pul yechish</button>
      </div>
    </div>
  </section>
</div>

<nav id="nav" class="hidden">
  <button data-view="tasks" class="on"><span class="i">📋</span>Vazifalar</button>
  <button data-view="history"><span class="i">🕓</span>Tarix</button>
  <button data-view="profile"><span class="i">👤</span>Profil</button>
</nav>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheet-body"></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const API = (new URLSearchParams(location.search).get('api') || '').replace(/\/+$/, '');
  const state = { me: null, tasks: [], method: null, view: 'tasks' };

  const $ = (s) => document.querySelector(s);
  const KIND = { text: '✍️ Matn', photo: '📷 Rasm', both: '✍️ Matn + 📷 Rasm' };
  const SUB_STATUS = { pending: ['Tekshirilmoqda', 'warn'], approved: ['Qabul qilindi', 'ok'], rejected: ['Rad etildi', 'bad'] };
  const WD_STATUS = { pending: ["Ko'rib chiqilmoqda", 'warn'], paid: ["To'landi", 'ok'], rejected: ['Rad etildi', 'bad'] };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function som(n) { return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + " so'm"; }
  function dmy(d) { const p = String(d || '').slice(0, 10).split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : ''; }
  function badge(map, s) { const v = map[s]; return v ? `<span class="badge ${v[1]}">${v[0]}</span>` : ''; }
  function haptic(k) {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (k === 'ok') tg.HapticFeedback.notificationOccurred('success');
      else if (k === 'err') tg.HapticFeedback.notificationOccurred('error');
      else tg.HapticFeedback.selectionChanged();
    } catch (e) {}
  }
  function toast(msg, kind) {
    const el = $('#toast');
    el.textContent = msg;
    el.className = 'toast show ' + (kind || '');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { el.className = 'toast ' + (kind || ''); }, 3500);
  }
  function fatal(msg) {
    $('#loading').classList.add('hidden');
    ['#view-tasks', '#view-history', '#view-profile', '#nav'].forEach((s) => $(s).classList.add('hidden'));
    const f = $('#fatal');
    f.innerHTML = `<div class="logo">V</div><div style="font-weight:700;font-size:17px;margin-bottom:6px">Vozi</div>
      <div class="muted">${esc(msg)}</div><div style="height:16px"></div>
      <button class="btn ghost" id="retry">Qayta urinish</button>`;
    f.classList.remove('hidden');
    $('#retry').onclick = () => location.reload();
  }

  async function api(path, opts) {
    opts = opts || {};
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);
    try {
      const headers = Object.assign({ Authorization: 'tma ' + tg.initData }, opts.headers || {});
      const r = await fetch(API + path, Object.assign({}, opts, { headers, signal: ctrl.signal }));
      let data;
      try { data = await r.json(); } catch (e) { throw new Error('Server javob bermadi. Keyinroq urinib ko\'ring.'); }
      if (!data.ok) throw new Error(data.error || 'Xatolik yuz berdi.');
      return data;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('Server javob bermayapti. Internetni tekshiring.');
      if (e instanceof TypeError) throw new Error('Serverga ulanib bo\'lmadi. Keyinroq urinib ko\'ring.');
      throw e;
    } finally { clearTimeout(timer); }
  }

  // ---------- экраны ----------
  function show(view) {
    state.view = view;
    ['tasks', 'history', 'profile'].forEach((v) => $('#view-' + v).classList.toggle('hidden', v !== view));
    document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('nav button').forEach((b) => b.onclick = () => { haptic(); show(b.dataset.view); });

  function renderMe() {
    const me = state.me;
    $('#top-balance').textContent = som(me.user.balance);
    $('#p-name').textContent = me.user.first_name || 'Foydalanuvchi';
    $('#p-balance').textContent = som(me.user.balance);
    $('#p-earned').textContent = som(me.user.earned);
    $('#p-approved').textContent = me.user.approved;
    $('#wd-min').textContent = 'Minimal summa: ' + som(me.min_withdraw);
    $('#wd-pending').classList.toggle('hidden', !me.has_pending_withdrawal);
    $('#wd-form').classList.toggle('hidden', !!me.has_pending_withdrawal);
    const amount = $('#wd-amount');
    if (!amount.value) amount.value = me.user.balance >= me.min_withdraw ? me.user.balance : '';

    if (!state.method && me.methods.length) state.method = me.methods[0];
    $('#wd-methods').innerHTML = me.methods.map((m) =>
      `<button class="chip ${state.method && state.method.id === m.id ? 'on' : ''}" data-id="${m.id}">${esc(m.name)}</button>`).join('');
    document.querySelectorAll('#wd-methods .chip').forEach((c) => c.onclick = () => {
      state.method = me.methods.find((m) => m.id === c.dataset.id);
      haptic(); renderMe();
    });
    const isCard = state.method && state.method.id === 'card';
    $('#wd-details-label').textContent = isCard ? 'Karta raqami (16 raqam)' : 'Telefon raqami';
    $('#wd-details').placeholder = isCard ? '8600 0000 0000 0000' : '+998 90 123 45 67';
  }

  function renderTasks() {
    const box = $('#task-list');
    if (!state.tasks.length) {
      box.innerHTML = '<div class="empty">Hozircha vazifalar yo\'q.<br>Tez orada yangilari qo\'shiladi 🙌</div>';
      return;
    }
    box.innerHTML = state.tasks.map((t) => `
      <button class="task" data-id="${t.id}">
        <div class="task-top"><div class="task-title">${esc(t.title)}</div><div class="reward">+${som(t.reward)}</div></div>
        <div class="meta">${KIND[t.kind] || ''} · ${t.left} ta joy qoldi · ${dmy(t.deadline)} gacha</div>
        ${badge(SUB_STATUS, t.my_status)}
      </button>`).join('');
    box.querySelectorAll('.task').forEach((b) => b.onclick = () => { haptic(); openTask(+b.dataset.id); });
  }

  function renderHistory(h) {
    $('#sub-list').innerHTML = h.submissions.length ? h.submissions.map((s) => `
      <div class="row"><div><div class="t">${esc(s.title)}</div>
        <div class="muted">${dmy(s.created_at)}${s.status === 'rejected' && s.reason ? ' · ' + esc(s.reason) : ''}</div></div>
        <div style="text-align:right"><div class="reward">+${som(s.reward)}</div>${badge(SUB_STATUS, s.status)}</div></div>`).join('')
      : '<div class="muted" style="padding:8px 0">Hali ishlar yo\'q.</div>';
    $('#wd-list').innerHTML = h.withdrawals.length ? h.withdrawals.map((w) => `
      <div class="row"><div><div class="t">${esc(w.method)} ${esc(w.details)}</div>
        <div class="muted">${dmy(w.created_at)}${w.status === 'rejected' && w.reason ? ' · ' + esc(w.reason) : ''}</div></div>
        <div style="text-align:right"><div class="t">${som(w.amount)}</div>${badge(WD_STATUS, w.status)}</div></div>`).join('')
      : '<div class="muted" style="padding:8px 0">Hali so\'rovlar yo\'q.</div>';
  }

  async function loadAll() {
    const [me, tasks, hist] = await Promise.all([api('/api/me'), api('/api/tasks'), api('/api/history')]);
    state.me = me; state.tasks = tasks.tasks;
    renderMe(); renderTasks(); renderHistory(hist);
  }

  // ---------- задание ----------
  function closeSheet() { $('#sheet').classList.remove('on'); $('#sheet-bg').classList.remove('on'); }
  $('#sheet-bg').onclick = closeSheet;

  function openTask(id) {
    const t = state.tasks.find((x) => x.id === id);
    if (!t) return;
    const needText = t.kind === 'text' || t.kind === 'both';
    const needPhoto = t.kind === 'photo' || t.kind === 'both';
    const canSend = !t.my_status || t.my_status === 'rejected';
    let status = '';
    if (t.my_status === 'pending') status = '<div class="note">🕓 Ishingiz tekshirilmoqda. Natija bot orqali keladi.</div>';
    if (t.my_status === 'approved') status = '<div class="note ok">✅ Ishingiz qabul qilindi, mukofot balansga tushdi.</div>';
    if (t.my_status === 'rejected') status = `<div class="note bad">❌ Rad etildi: ${esc(t.my_reason || '')}<br>Tuzatib, qayta yuborishingiz mumkin.</div>`;

    $('#sheet-body').innerHTML = `
      <div class="task-top"><div class="task-title" style="font-size:18px">${esc(t.title)}</div>
        <div class="reward" style="font-size:17px">+${som(t.reward)}</div></div>
      <div class="meta">${KIND[t.kind] || ''} · ${t.left} ta joy qoldi · ${dmy(t.deadline)} gacha</div>
      <div class="desc">${esc(t.description)}</div>
      ${status}
      ${canSend ? `
        ${needText ? `<label for="f-text">Sizning ishingiz</label>
          <textarea id="f-text" maxlength="4000" placeholder="Matnni shu yerga yozing..."></textarea>
          <div class="counter" id="f-count">Kamida 20 ta belgi</div>` : ''}
        ${needPhoto ? `<label>Rasm</label>
          <label class="photo-box" id="f-photo-box">📷 Rasm tanlash uchun bosing
            <input type="file" id="f-photo" accept="image/*" class="hidden"></label>` : ''}
        <div style="height:16px"></div>
        <button class="btn" id="f-send">Yuborish</button>` : ''}
      <div style="height:10px"></div>
      <button class="btn ghost" id="f-close">Yopish</button>`;

    $('#f-close').onclick = closeSheet;
    const txt = $('#f-text');
    if (txt) txt.oninput = () => {
      const n = txt.value.trim().length; const c = $('#f-count');
      c.textContent = n < 20 ? `Kamida 20 ta belgi (yana ${20 - n})` : `${n} ta belgi ✓`;
      c.classList.toggle('good', n >= 20);
    };
    const ph = $('#f-photo');
    if (ph) ph.onchange = () => {
      const f = ph.files[0]; if (!f) return;
      const url = URL.createObjectURL(f);
      $('#f-photo-box').firstChild.textContent = '';
      let img = $('#f-photo-box img');
      if (!img) { img = document.createElement('img'); $('#f-photo-box').prepend(img); }
      img.src = url;
    };
    const send = $('#f-send');
    if (send) send.onclick = () => submitTask(t, send);

    $('#sheet').classList.add('on'); $('#sheet-bg').classList.add('on');
  }

  function compress(file) {
    return new Promise((resolve) => {
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob((b) => resolve(b || file), 'image/jpeg', 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  async function submitTask(t, btn) {
    const fd = new FormData();
    fd.append('task_id', t.id);
    const txt = $('#f-text');
    if (txt) {
      if (txt.value.trim().length < 20) { haptic('err'); toast('Matn kamida 20 ta belgidan iborat bo\'lishi kerak.', 'bad'); return; }
      fd.append('text', txt.value.trim());
    }
    const ph = $('#f-photo');
    if (ph) {
      if (!ph.files[0]) { haptic('err'); toast('Rasm yuklang.', 'bad'); return; }
      fd.append('photo', await compress(ph.files[0]), 'photo.jpg');
    }
    btn.disabled = true; btn.textContent = 'Yuborilmoqda...';
    try {
      const r = await api('/api/submit', { method: 'POST', body: fd });
      haptic('ok'); toast(r.message, 'ok'); closeSheet();
      await loadAll();
    } catch (e) {
      haptic('err'); toast(e.message, 'bad');
    } finally { btn.disabled = false; btn.textContent = 'Yuborish'; }
  }

  // ---------- вывод ----------
  function confirmBox(text) {
    return new Promise((resolve) => {
      if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) tg.showConfirm(text, resolve);
      else resolve(window.confirm(text));
    });
  }

  $('#wd-btn').onclick = async () => {
    const me = state.me; const m = state.method; const btn = $('#wd-btn');
    let digits = $('#wd-details').value.replace(/\D/g, '');
    const amount = parseInt($('#wd-amount').value, 10) || 0;
    if (!m) { toast("To'lov usulini tanlang.", 'bad'); return; }
    if (m.id === 'card' && digits.length !== 16) { haptic('err'); toast("Karta raqami 16 ta raqamdan iborat bo'lishi kerak.", 'bad'); return; }
    if (m.id !== 'card') {
      if (digits.length === 9) digits = '998' + digits;
      if (digits.length !== 12 || !digits.startsWith('998')) { haptic('err'); toast('Telefon raqami +998 XX XXX XX XX formatida bo\'lsin.', 'bad'); return; }
    }
    if (amount < me.min_withdraw) { haptic('err'); toast('Minimal summa: ' + som(me.min_withdraw), 'bad'); return; }
    if (amount > me.user.balance) { haptic('err'); toast("Balansda yetarli mablag' yo'q.", 'bad'); return; }
    const ok = await confirmBox(`${som(amount)} → ${m.name} •••• ${digits.slice(-4)}\nTasdiqlaysizmi?`);
    if (!ok) return;
    btn.disabled = true; btn.textContent = 'Yuborilmoqda...';
    try {
      const r = await api('/api/withdraw', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount, method: m.id, details: digits }),
      });
      haptic('ok'); toast(r.message, 'ok');
      $('#wd-details').value = ''; $('#wd-amount').value = '';
      await loadAll();
    } catch (e) {
      haptic('err'); toast(e.message, 'bad');
    } finally { btn.disabled = false; btn.textContent = 'Pul yechish'; }
  };

  // ---------- старт ----------
  async function start() {
    if (!tg || !tg.initData || !API) { fatal("Ilovani Telegram'dagi @VoziUzBot orqali oching."); return; }
    try {
      await loadAll();
      $('#loading').classList.add('hidden');
      $('#nav').classList.remove('hidden');
      show('tasks');
    } catch (e) { fatal(e.message); }
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && state.me) loadAll().catch(() => {});
  });
  start();
})();
</script>
</body>
</html>
